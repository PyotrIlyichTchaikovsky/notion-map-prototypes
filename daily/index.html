<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>俄乌战报｜Leaflet事件地图</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"><link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font:14px system-ui,sans-serif;color:#153047}#map{position:absolute;inset:0;background:#edf3f5}.toolbar{position:absolute;top:10px;right:10px;z-index:1100;display:flex;gap:5px}.toolbar button{padding:8px;background:white;border:1px solid #9fb9c3;border-radius:5px;color:#153047;cursor:pointer}#stamp{position:absolute;bottom:4px;left:6px;z-index:1000;background:#fffffff0;padding:4px 7px;border-radius:3px;font-size:11px;max-width:65%;pointer-events:none}#message{position:absolute;inset:25% 8% auto;z-index:1200;padding:16px;background:white;border:1px solid #b7cbd3;border-radius:8px;line-height:1.7;display:none}.event-marker{width:max-content!important;height:auto!important;white-space:nowrap}.event-label{display:flex;gap:5px;align-items:center;background:#fffffff2;box-shadow:0 1px 5px #18344755;border-radius:5px;border:1px solid #c3d4da;padding:5px 7px;color:#152f40}.event-label b{background:#b73540;color:white;border-radius:50%;min-width:22px;height:22px;line-height:22px;text-align:center}.event-label span{font-size:12px}.event-popup{line-height:1.6;max-height:min(260px,65vh);overflow-y:auto}.event-popup h3{margin:0 0 5px;font-size:15px}.event-popup p{margin:5px 0}.event-popup a{display:block;padding:7px 0;color:#006882;font-weight:600}.leaflet-popup-content{margin:12px;max-width:260px}#eventList{display:none;position:absolute;inset:50px 10px 35px auto;max-width:340px;width:calc(100% - 20px);overflow:auto;z-index:1150;background:#fffffff5;padding:10px;border:1px solid #a8bec7;border-radius:5px}#eventList button,#eventList a{display:block;width:100%;padding:9px;margin:4px 0;text-align:left;border:1px solid #d4e0e5;background:white;border-radius:4px;cursor:pointer;text-decoration:none;color:inherit}button:focus-visible,a:focus-visible{outline:3px solid #1e95ba}
</style></head><body><main id="map" aria-label="当日事件地图"></main><div class="toolbar"><button id="fit">还原全图</button><button id="list">事件列表</button></div><div id="eventList" aria-label="当日事件列表"></div><div id="stamp" role="status">正在读取地图数据</div><div id="message" role="alert"></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script><script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let map,group,allMarkers=[];
function base64(s){return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0))}
function note(s){$('#message').style.display='block';$('#message').textContent=s;$('#stamp').textContent=s}
function link(url,label){const a=document.createElement('a');const u=new URL(url);if(!['app.notion.com','www.notion.so','notion.so'].includes(u.hostname)||u.protocol!=='https:')throw Error('事件链接域名不受支持');a.href=u.href;a.target='_top';a.rel='noopener noreferrer';a.textContent=label;return a}
function popup(e,date){const box=document.createElement('article');box.className='event-popup';const title=document.createElement('h3');title.textContent=e.place;box.append(title);for(const t of [date+'｜'+e.label,e.summary,'证据状态：'+e.confidence,'位置说明：'+e.accuracy]){const p=document.createElement('p');p.textContent=t;box.append(p)}box.append(link(e.eventUrl,'查看第三节事件详情'),link(e.historyUrl,'查看本地区全部历史事件'));return box}
function fit(){if(allMarkers.length)map.fitBounds(L.featureGroup(allMarkers).getBounds().pad(.18),{maxZoom:8})}
async function start(){try{map=L.map('map',{zoomControl:false,scrollWheelZoom:true}).setView([48.8,34.1],5);L.control.zoom({position:'topleft'}).addTo(map);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,referrerPolicy:'strict-origin-when-cross-origin',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);new ResizeObserver(()=>map.invalidateSize()).observe($('#map'));$('#fit').onclick=fit;$('#list').onclick=()=>$('#eventList').style.display=$('#eventList').style.display==='block'?'none':'block';
if(params.has('blank')){note('日报地图模板｜等待当日数据；此框用于保留正方形布局。');return}
const filename=params.get('snapshot'),secret=new URLSearchParams(location.hash.slice(1)).get('k');if(!filename||!secret)throw Error('此地图需从有权限的Notion日报打开；当前链接缺少本篇地图数据。');if(!/^[A-Za-z0-9._-]+\.json$/.test(filename))throw Error('快照文件名无效');const response=await fetch('snapshots/'+filename,{referrerPolicy:'no-referrer'});if(!response.ok)throw Error('地图快照尚未发布：HTTP '+response.status);const payload=await response.json();const key=await crypto.subtle.importKey('raw',base64(secret),{name:'AES-GCM'},false,['decrypt']);let bytes;try{bytes=await crypto.subtle.decrypt({name:'AES-GCM',iv:base64(payload.iv)},key,base64(payload.data))}catch{throw Error('地图数据校验失败：请从原Notion日报重新打开。')}const data=JSON.parse(new TextDecoder().decode(bytes));if(data.version!==1||!Array.isArray(data.events))throw Error('地图数据版本无效');document.title=data.date+'｜俄乌战报事件地图';group=L.markerClusterGroup({maxClusterRadius:42,spiderfyOnMaxZoom:true});map.addLayer(group);let unmapped=0;
for(const [i,e] of data.events.entries()){const button=document.createElement('button');button.textContent=(i+1)+'. '+e.place+'｜'+e.label;$('#eventList').append(button);if(!Number.isFinite(e.lat)||!Number.isFinite(e.lon)){unmapped++;button.replaceWith(link(e.eventUrl,button.textContent+'（地点待核准）'));continue}const label=document.createElement('div');label.className='event-label';const n=document.createElement('b');n.textContent=i+1;const name=document.createElement('span');name.textContent=e.place+' · '+e.label;label.append(n,name);const marker=L.marker([e.lat,e.lon],{title:e.place,icon:L.divIcon({className:'event-marker',html:label.outerHTML,iconAnchor:[12,16]})}).bindPopup(popup(e,data.date),{maxWidth:280,autoPan:true});group.addLayer(marker);allMarkers.push(marker);button.onclick=()=>{group.zoomToShowLayer(marker,()=>marker.openPopup());$('#eventList').style.display='none'}}fit();$('#stamp').textContent=data.date+'｜'+allMarkers.length+'处地图标记'+(unmapped?'，'+unmapped+'项地点待定位':'')+'｜地区代表点，非精确坐标';
}catch(e){note('地图未就绪：'+e.message)}}start();
</script></body></html>
