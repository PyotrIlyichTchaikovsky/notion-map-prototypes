<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Leaflet地图布局验收</title><style>body{margin:16px;font:14px system-ui;background:#edf2f5;color:#173447}h1{font-size:18px}button{padding:8px;margin-right:8px}iframe{display:block;width:390px;height:844px;border:1px solid #8da5b0;margin-top:10px;background:white}#metrics{margin-top:8px}</style></head><body><h1>Leaflet地图布局验收</h1><p>手机尺寸布局模拟，不代表手机实机或Notion App验收。</p><button id="phone">390×844 手机尺寸</button><button id="square">704×704 正方形</button><div id="metrics" role="status">正在载入测试地图</div><iframe id="frame" title="固定尺寸地图验收"></iframe><script>const f=document.querySelector("#frame"),u=new URL("index.html",location.href);u.search=location.search;u.hash=location.hash;f.src=u.href;function measure(){try{document.querySelector("#metrics").textContent="地图实际视口："+f.contentDocument.documentElement.clientWidth+"×"+f.contentDocument.documentElement.clientHeight}catch{document.querySelector("#metrics").textContent="地图尚未可读"}}f.onload=measure;document.querySelector("#phone").onclick=()=>{f.style.width="390px";f.style.height="844px";requestAnimationFrame(measure)};document.querySelector("#square").onclick=()=>{f.style.width="704px";f.style.height="704px";requestAnimationFrame(measure)};</script></body></html>
